# njason.dev static site (self-hosted; Traefik terminates TLS and forwards here).

# One address: www redirects to the bare domain (the canonical URL, and the only origin the lab's API accepts).
server {
  listen 80;
  server_name www.njason.dev;
  return 301 https://njason.dev$request_uri;
}
server {
  listen 80 default_server; # every other host name, njason.dev included
  server_name _;
  root /usr/share/nginx/html;

  # Not launched yet: keep search engines out until Jason says so (remove this line at launch).
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

  # Astro's hashed assets never change once built
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404.html;
}
